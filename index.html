<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Geometria — Algebra Lineare (Diverio)</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#4c8dff; --accent2:#7aa2ff;
    --ok:#2ea043; --okbg:#10331b; --bad:#d83a3a; --badbg:#3a1414;
    --warn:#d8a13a; --warnbg:#332a10;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;}
  .hidden{display:none!important;}

  /* ---- MENU ---- */
  .mode-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:220px;border:1px solid var(--border);background:var(--panel);
    color:var(--txt);padding:16px;border-radius:12px;cursor:pointer;text-align:left;
    transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);background:var(--panel2);}
  .mode-btn b{font-size:1.05rem;}
  .mode-btn span{display:block;color:var(--muted);font-size:.85rem;margin-top:4px;}
  .mode-btn.primary{border-color:var(--accent);background:#13233f;}

  .pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.pool-grid{grid-template-columns:1fr;}}
  .pool-card{border:1px solid var(--border);background:var(--panel);border-radius:12px;
    padding:14px;cursor:pointer;transition:.15s;position:relative;}
  .pool-card:hover{border-color:var(--accent);background:var(--panel2);}
  .pool-card.empty{opacity:.55;cursor:not-allowed;}
  .pool-card.empty:hover{border-color:var(--border);background:var(--panel);}
  .pool-card .n{font-weight:600;font-size:.98rem;}
  .pool-card .meta{color:var(--muted);font-size:.8rem;margin-top:6px;}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
    border-radius:20px;margin-top:8px;letter-spacing:.3px;}
  .badge.full{background:var(--okbg);color:#5fd980;border:1px solid #235c33;}
  .badge.todo{background:var(--warnbg);color:#e0b85a;border:1px solid #5c4a23;}

  /* ---- QUIZ ---- */
  .qhead{display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:.82rem;margin-bottom:14px;}
  .qhead .src{font-style:italic;}
  .progress{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:.3s;}

  .fig{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin:0 0 16px;text-align:center;overflow-x:auto;}
  .qtext{font-size:1.08rem;margin:0 0 18px;}
  .qtext .lbl{display:inline-block;background:var(--panel2);border:1px solid var(--border);
    color:var(--accent2);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;
    margin-right:8px;vertical-align:middle;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--border);background:var(--panel);color:var(--txt);
    padding:13px 15px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:1rem;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--panel2);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--okbg);}
  .opt.wrong{border-color:var(--bad);background:var(--badbg);}

  .fb{margin-top:16px;border-radius:10px;padding:14px;font-size:.95rem;display:none;}
  .fb.show{display:block;}
  .fb.hint{background:var(--badbg);border:1px solid #6b2222;}
  .fb.hint b{color:#ff8585;}
  .fb.sol{background:var(--okbg);border:1px solid #235c33;}
  .fb.sol b{color:#5fd980;}

  .navrow{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .cont{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:.12s;}
  .cont:hover{background:var(--accent2);}
  .menu-btn{background:transparent;color:var(--muted);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.9rem;}
  .menu-btn:hover{color:var(--txt);border-color:var(--accent);}

  .end{text-align:center;padding:40px 10px;}
  .end h2{font-size:1.4rem;}
  .end .score{font-size:2.2rem;font-weight:700;color:var(--accent2);margin:10px 0;}

  /* ---- math helpers ---- */
  .matrix{display:inline-flex;flex-direction:column;vertical-align:middle;
    border-left:2px solid var(--txt);border-right:2px solid var(--txt);
    padding:2px 8px;margin:0 3px;border-radius:3px;}
  .mrow{display:flex;justify-content:center;}
  .mcell{min-width:26px;text-align:center;padding:1px 5px;font-variant-numeric:tabular-nums;}
  .vec{display:inline-flex;flex-direction:column;vertical-align:middle;
    border-left:2px solid var(--txt);border-right:2px solid var(--txt);
    padding:2px 6px;margin:0 2px;border-radius:3px;}
  code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;}
  svg{max-width:100%;height:auto;}
  .axislbl{font-size:11px;fill:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== MENU ===================== -->
  <section id="menu">
    <h1>Quiz Geometria — Algebra Lineare</h1>
    <p class="sub">Geometria per Fisici · Sapienza · docente Diverio. Difficolt&agrave; calibrata sugli esami in banca-dati. Risposta sbagliata &rarr; suggerimento mirato sul trabocchetto.</p>

    <div class="mode-row">
      <button class="mode-btn primary" onclick="start('ALL')">
        <b>&#127922; Mischia tutto</b>
        <span>Tutte le domande dei pool disponibili, in ordine casuale.</span>
      </button>
    </div>

    <div class="pool-grid" id="poolGrid"></div>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <span id="qpool"></span>
      <span id="qpos"></span>
    </div>
    <div class="progress"><i id="qbar"></i></div>

    <div class="fig hidden" id="qfig"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="qopts"></div>

    <div class="fb hint" id="qhint"></div>
    <div class="fb sol" id="qsol"></div>

    <div class="navrow">
      <button class="menu-btn" onclick="toMenu()">&#8592; Menu</button>
      <button class="cont hidden" id="qcont"></button>
    </div>
  </section>

  <!-- ===================== END ===================== -->
  <section id="end" class="hidden">
    <div class="end">
      <h2>Pool completato</h2>
      <div class="score" id="endScore"></div>
      <p class="sub" id="endMsg"></p>
      <button class="cont" onclick="toMenu()">Torna al menu</button>
    </div>
  </section>

</div>

<script>
"use strict";

/* =====================================================================
   HELPERS DI RENDERING MATEMATICO
   ===================================================================== */
function M(rows){
  return '<span class="matrix">'+rows.map(function(r){
    return '<div class="mrow">'+r.map(function(c){return '<span class="mcell">'+c+'</span>';}).join('')+'</div>';
  }).join('')+'</span>';
}
function V(col){ // vettore colonna
  return '<span class="vec">'+col.map(function(c){return '<div class="mrow">'+c+'</div>';}).join('')+'</span>';
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* =====================================================================
   FIGURE SVG INLINE (riutilizzabili)
   ===================================================================== */
var SVG = {
  // due piani per l'origine in R^3 che si intersecano in una retta
  duePiani:
    '<svg viewBox="0 0 320 180" width="320" height="180">'+
    '<polygon points="40,40 200,20 280,80 120,100" fill="#4c8dff" opacity="0.20" stroke="#4c8dff"/>'+
    '<polygon points="60,140 230,150 250,70 80,60" fill="#7aa2ff" opacity="0.20" stroke="#7aa2ff"/>'+
    '<line x1="70" y1="90" x2="255" y2="78" stroke="#e6edf3" stroke-width="2.5"/>'+
    '<text x="205" y="15" class="axislbl">U</text>'+
    '<text x="255" y="62" class="axislbl">W</text>'+
    '<text x="258" y="92" class="axislbl">U&#8745;W</text>'+
    '</svg>'
};

/* =====================================================================
   DEFINIZIONE POOL (ordine = mappa esercizi, freq. decrescente)
   status: 'full' = popolato a fondo | 'todo' = da estendere
   ===================================================================== */
var POOLS = [
  {id:'sottospazi', name:'1 · Sottospazi & Grassmann', diff:'2&ndash;3', status:'full'},
  {id:'diag',       name:'2 · Diagonalizzabilit&agrave; (m.a. vs m.g.)', diff:'3&ndash;4', status:'full'},
  {id:'spettrale',  name:'3 · Prod. scalare / Gram&ndash;Schmidt / Spettrale', diff:'3&ndash;4', status:'full'},
  {id:'sistemi',    name:'4 · Sistemi parametrici (Rouch&eacute;&ndash;Capelli)', diff:'3', status:'full'},
  {id:'applicazioni',name:'5 · Applicazioni lineari (ker, im, basi)', diff:'3&ndash;4', status:'full'},
  {id:'complessi',  name:'6 · Numeri complessi e strutture su &#8450;', diff:'3', status:'full'},
  {id:'forme',      name:'7 · Forme bilineari / Segnatura', diff:'4', status:'full'},
  {id:'jordan',     name:'8 · Jordan / Triangolarizzabilit&agrave;', diff:'4&ndash;5', status:'full'},
  {id:'simmetrici', name:'9 · Operatori simmetrici / isometrie', diff:'4', status:'full'},
  {id:'e3',         name:'10 · Geometria E&sup3; (priorit&agrave; bassa)', diff:'2', status:'full'}
];

/* =====================================================================
   BANCA DATI DOMANDE
   Ogni unit = { pool, src, svg?, steps:[ step, ... ] }
   step = { t, svg?, opts:[{x,c?}], hint, sol, cont? }
   Una unit con piu' step realizza la sequenza L1+L2+...
   ===================================================================== */
var Q = {};

/* ---------- POOL 1 : SOTTOSPAZI & GRASSMANN (COMPLETO) ---------- */
Q.sottospazi = [

  { pool:'sottospazi', src:'tipo 1 · Span e dipendenza',
    steps:[{
      t:'In &#8477;&#8308; siano v&#8321;=(1,0,1,0), v&#8322;=(0,1,0,1), v&#8323;=(1,1,1,1). Quanto vale dim&#8202;Span(v&#8321;,v&#8322;,v&#8323;)?',
      opts:[{x:'2',c:true},{x:'3'},{x:'1'},{x:'4'}],
      hint:'<b>Conta i generatori INDIPENDENTI, non i generatori.</b> Verifica se v&#8323; &egrave; combinazione di v&#8321; e v&#8322;.',
      sol:'<b>dim = 2.</b> v&#8323; = v&#8321;+v&#8322;, quindi v&#8323; &egrave; ridondante: lo Span coincide con Span(v&#8321;,v&#8322;), che sono indipendenti.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · Grassmann (stima minima)',
    steps:[{
      t:'Siano U,&#8202;W sottospazi di &#8477;&#8309; con dim&#8202;U=3 e dim&#8202;W=4. Qual &egrave; il MINIMO valore possibile di dim(U&#8745;W)?',
      opts:[{x:'2',c:true},{x:'0'},{x:'1'},{x:'3'}],
      hint:'<b>U+W vive dentro &#8477;&#8309;</b>, quindi dim(U+W) &le; 5. Isola dim(U&#8745;W) dalla formula di Grassmann.',
      sol:'<b>2.</b> Grassmann: dim(U&#8745;W)=dim&#8202;U+dim&#8202;W&minus;dim(U+W)=3+4&minus;dim(U+W) &ge; 7&minus;5 = 2.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · Grassmann (stima massima)',
    steps:[{
      t:'Stessi dati: U,&#8202;W &sub; &#8477;&#8309;, dim&#8202;U=3, dim&#8202;W=4. Qual &egrave; il MASSIMO possibile di dim(U&#8745;W)?',
      opts:[{x:'3',c:true},{x:'4'},{x:'2'},{x:'7'}],
      hint:'L&rsquo;intersezione &egrave; contenuta sia in U sia in W: non pu&ograve; superare la dimensione del pi&ugrave; piccolo.',
      sol:'<b>3.</b> dim(U&#8745;W) &le; min(dim&#8202;U,dim&#8202;W)=3, raggiunto quando U &sub; W.'
    }]
  },

  { pool:'sottospazi', src:'prova20190121 Es. 3 (trabocchetto esplicito)',
    steps:[{
      t:'L&rsquo;insieme S = { A &isin; M&#8322;(&#8477;) : det&#8202;A = 0 } &egrave; un sottospazio vettoriale di M&#8322;(&#8477;)?',
      opts:[{x:'No: non &egrave; chiuso per somma',c:true},{x:'S&igrave;, ha dimensione 3'},{x:'S&igrave;, &egrave; il nucleo del det'},{x:'S&igrave;, contiene 0 quindi basta'}],
      hint:'<b>Il determinante non &egrave; lineare.</b> Cerca due matrici singolari la cui somma sia invertibile.',
      sol:'<b>No.</b> Prendi A='+M([['1','0'],['0','0']])+' e B='+M([['0','0'],['0','1']])+': det&#8202;A=det&#8202;B=0, ma A+B=I con det=1&ne;0. S non &egrave; chiuso per somma. (Contenere 0 &egrave; necessario, non sufficiente.)'
    }]
  },

  { pool:'sottospazi', src:'prova20190121 (analogia traccia)',
    steps:[{
      t:'L&rsquo;insieme T = { A &isin; M&#8322;(&#8477;) : tr&#8202;A = 0 } &egrave; un sottospazio? Se s&igrave;, di che dimensione?',
      opts:[{x:'S&igrave;, dimensione 3',c:true},{x:'No, non contiene 0'},{x:'S&igrave;, dimensione 1'},{x:'No, la traccia non &egrave; lineare'}],
      hint:'A differenza del determinante, la traccia <b>&egrave;</b> lineare: tr(A+B)=tr&#8202;A+tr&#8202;B e tr(&lambda;A)=&lambda;&#8202;tr&#8202;A.',
      sol:'<b>S&igrave;, dim = 3.</b> T = ker della forma lineare tr : M&#8322;(&#8477;)&rarr;&#8477;, non nulla; quindi dim = 4&minus;1 = 3.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · {A diagonalizzabile} (trabocchetto)',
    steps:[{
      t:'L&rsquo;insieme D = { A &isin; M&#8322;(&#8477;) : A diagonalizzabile } &egrave; un sottospazio di M&#8322;(&#8477;)?',
      opts:[{x:'No: somma di diagonalizzabili pu&ograve; non esserlo',c:true},{x:'S&igrave;, &egrave; chiuso per somma e prodotto per scalare'},{x:'S&igrave;, perch&eacute; contiene tutte le simmetriche'},{x:'No, perch&eacute; non contiene la matrice nulla'}],
      hint:'La nulla &egrave; diagonalizzabile, quindi 0&isin;D. Il problema &egrave; la <b>chiusura per somma</b>. Cerca un controesempio con autovalori distinti.',
      sol:'<b>No.</b> A='+M([['1','2'],['0','&minus;1']])+' (autovalori 1,&minus;1: diag.) e B=diag(&minus;1,1) (diag.) danno A+B='+M([['0','2'],['0','0']])+', che ha autovalore 0 doppio ma non &egrave; nulla: non diagonalizzabile.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · sottospazi di R[t]',
    steps:[{
      t:'In &#8477;[t]<sub>&le;3</sub> (polinomi di grado &le; 3, dim 4) considera U = { p : p(1)=0 }. Quanto vale dim&#8202;U?',
      opts:[{x:'3',c:true},{x:'4'},{x:'2'},{x:'1'}],
      hint:'p &#8614; p(1) &egrave; un <b>funzionale lineare non nullo</b>. Il suo nucleo abbassa la dimensione di 1.',
      sol:'<b>3.</b> La valutazione in 1 &egrave; lineare e non nulla; U &egrave; il suo nucleo: dim = 4&minus;1 = 3.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · vincoli multipli su polinomi',
    steps:[{
      t:'In &#8477;[t]<sub>&le;2</sub> (dim 3) sia U = { p : p(0)=0 e p&prime;(0)=0 }. Quanto vale dim&#8202;U?',
      opts:[{x:'1',c:true},{x:'2'},{x:'0'},{x:'3'}],
      hint:'Scrivi p = a+bt+ct&sup2;. Traduci p(0)=0 e p&prime;(0)=0 in condizioni su a,b,c.',
      sol:'<b>1.</b> p(0)=a=0 e p&prime;(0)=b=0, quindi p = c&#8202;t&sup2;. Resta un solo parametro: dim = 1.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · equazioni cartesiane &rarr; dim',
    steps:[{
      t:'In &#8477;&#8308; sia U = { (x,y,z,w) : x+y=0, z&minus;w=0 }. Quanto vale dim&#8202;U?',
      opts:[{x:'2',c:true},{x:'3'},{x:'1'},{x:'4'}],
      hint:'Le due equazioni sono <b>indipendenti</b>: ognuna abbassa la dimensione di 1. dim = n &minus; (n. equazioni indipendenti).',
      sol:'<b>2.</b> Due equazioni cartesiane indipendenti in &#8477;&#8308;: dim = 4&minus;2 = 2.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · somma diretta',
    steps:[{
      t:'In &#8477;&#179; siano U=Span((1,0,0),(0,1,0)) e W=Span((0,0,1)). &Egrave; vero che &#8477;&#179; = U &oplus; W?',
      opts:[{x:'S&igrave;: somma = &#8477;&#179; e intersezione = {0}',c:true},{x:'No: la somma non &egrave; tutto &#8477;&#179;'},{x:'No: U&#8745;W ha dimensione 1'},{x:'S&igrave;, ma solo perch&eacute; dim&#8202;U+dim&#8202;W=3'}],
      hint:'Somma diretta richiede DUE cose: U+W = &#8477;&#179; <b>e</b> U&#8745;W = {0}. La sola somma delle dimensioni non basta in generale.',
      sol:'<b>S&igrave;.</b> U &egrave; il piano z=0, W l&rsquo;asse z: U&#8745;W={0} e U+W=&#8477;&#179;. La condizione dimensionale qui &egrave; verificata e l&rsquo;intersezione &egrave; banale.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · finta somma diretta (trabocchetto)',
    steps:[{
      t:'In &#8477;&#179; siano U=Span((1,1,0),(0,1,1)) e W=Span((1,0,&minus;1)). La somma U+W &egrave; diretta?',
      opts:[{x:'No: il generatore di W sta in U',c:true},{x:'S&igrave;: dim&#8202;U+dim&#8202;W=3=&#8477;&#179;'},{x:'S&igrave;: i tre vettori sono indipendenti'},{x:'No: U e W sono uguali'}],
      hint:'Prima di fidarti del conteggio dimensionale, <b>controlla se (1,0,&minus;1)&isin;U</b>. Prova (1,1,0)&minus;(0,1,1).',
      sol:'<b>No, non &egrave; diretta.</b> (1,1,0)&minus;(0,1,1)=(1,0,&minus;1), quindi W&sub;U: U&#8745;W=W&ne;{0}, e U+W=U ha dim 2 (non 3).'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · complemento ortogonale',
    steps:[{
      t:'In &#8477;&#179; col prodotto scalare standard, sia U = { (x,y,z) : x+y+z=0 }. Quanto vale dim&#8202;U<sup>&#8869;</sup>?',
      opts:[{x:'1',c:true},{x:'2'},{x:'0'},{x:'3'}],
      hint:'U &egrave; un piano (dim 2). U<sup>&#8869;</sup> &egrave; generato dal vettore normale al piano.',
      sol:'<b>1.</b> dim&#8202;U=2, e dim&#8202;U<sup>&#8869;</sup>=3&minus;2=1: U<sup>&#8869;</sup>=Span((1,1,1)), il vettore dei coefficienti dell&rsquo;equazione.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · intersezione di due piani',
    svg:SVG.duePiani,
    steps:[{
      t:'In &#8477;&#179; siano U e W due piani DISTINTI passanti per l&rsquo;origine. Quanto vale dim(U&#8745;W)?',
      opts:[{x:'1 (una retta)',c:true},{x:'0 (solo l&rsquo;origine)'},{x:'2'},{x:'Dipende dai piani'}],
      hint:'Due piani distinti per l&rsquo;origine non possono intersecarsi solo in {0} in &#8477;&#179;. Usa Grassmann: la loro somma &egrave; tutto &#8477;&#179;.',
      sol:'<b>1.</b> Distinti &rArr; U+W=&#8477;&#179; (dim 3). Grassmann: dim(U&#8745;W)=2+2&minus;3=1, una retta.'
    }]
  },

  { pool:'sottospazi', src:'tipo 1 · M&#8322; = Sym &oplus; Antisym',
    steps:[
      { t:'<span class="lbl">L1</span> In M&#8322;(&#8477;) (dim 4), qual &egrave; la dimensione del sottospazio Sym = { A : A<sup>T</sup>=A } delle matrici simmetriche?',
        opts:[{x:'3',c:true},{x:'4'},{x:'1'},{x:'2'}],
        hint:'Una simmetrica 2&times;2 ha forma '+M([['a','b'],['b','c']])+': conta i parametri liberi.',
        sol:'<b>3.</b> Tre parametri liberi (a, b, c). dim&#8202;Sym = 3.',
        cont:'Continua &rarr; le antisimmetriche'
      },
      { t:'<span class="lbl">L2</span> Sia Antisym = { A : A<sup>T</sup>=&minus;A }. &Egrave; vero che M&#8322;(&#8477;) = Sym &oplus; Antisym?',

/* =====================================================================
   ENGINE
   ===================================================================== */
var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

function poolCount(id){ return (Q[id]||[]).reduce(function(n,u){return n+u.steps.length;},0); }

function renderMenu(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = '';
  POOLS.forEach(function(p){
    var units = Q[p.id]||[];
    var n = poolCount(p.id);
    var empty = units.length===0;
    var card = document.createElement(empty?'div':'button');
    card.className = 'pool-card'+(empty?' empty':'');
    if(!empty) card.onclick = function(){ start(p.id); };
    card.innerHTML =
      '<div class="n">'+p.name+'</div>'+
      '<div class="meta">Difficolt&agrave; '+p.diff+' &middot; '+(empty?'0 unit&agrave;':(n+' unit&agrave;'))+'</div>'+
      '<span class="badge '+(p.status==='full'?'full':'todo')+'">'+
        (p.status==='full'?'COMPLETO':'DA ESTENDERE')+'</span>';
    g.appendChild(card);
  });
}

function start(poolId){
  var units = [];
  if(poolId==='ALL'){
    POOLS.forEach(function(p){ (Q[p.id]||[]).forEach(function(u){ units.push(u); }); });
  } else {
    units = (Q[poolId]||[]).slice();
  }
  if(units.length===0) return;
  units = shuffle(units.slice());
  S = { units:units, ui:0, si:0, correct:0, total:0, answered:false, poolId:poolId };
  show('quiz');
  renderStep();
}

function poolNameById(id){
  for(var i=0;i<POOLS.length;i++) if(POOLS[i].id===id) return POOLS[i].name;
  return id;
}

function renderStep(){
  var u = S.units[S.ui];
  var st = u.steps[S.si];
  S.answered = false;

  // header
  document.getElementById('qpool').innerHTML =
    (S.poolId==='ALL'?'Mischia':poolNameById(S.poolId));
  document.getElementById('qpos').innerHTML =
    'Domanda '+(S.ui+1)+' / '+S.units.length+
    (u.steps.length>1?(' &middot; parte '+(S.si+1)+'/'+u.steps.length):'')+
    ' &middot; <span class="src">'+u.src+'</span>';
  document.getElementById('qbar').style.width = (100*(S.ui)/S.units.length)+'%';

  // figura: di step se presente, altrimenti di unit
  var fig = document.getElementById('qfig');
  var svg = st.svg || (S.si===0 ? u.svg : null);
  if(svg){ fig.innerHTML = svg; fig.classList.remove('hidden'); }
  else { fig.innerHTML=''; fig.classList.add('hidden'); }

  document.getElementById('qtext').innerHTML = st.t;

  // opzioni mescolate
  var opts = shuffle(st.opts.map(function(o){return o;}));
  var box = document.getElementById('qopts');
  box.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.x;
    b.onclick = function(){ answer(b, o, st); };
    box.appendChild(b);
  });

  document.getElementById('qhint').classList.remove('show');
  document.getElementById('qsol').classList.remove('show');
  document.getElementById('qcont').classList.add('hidden');
}

function answer(btn, opt, st){
  if(opt.c){
    // corretto
    btn.classList.add('correct');
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),
      function(b){ b.disabled = true; });
    document.getElementById('qhint').classList.remove('show');
    var sol = document.getElementById('qsol');
    sol.innerHTML = '<b>Corretto.</b> '+st.sol;
    sol.classList.add('show');
    if(!S.answered){ S.correct++; }
    S.answered = true;
    var c = document.getElementById('qcont');
    var last = (S.si === S.units[S.ui].steps.length-1);
    c.innerHTML = last ? 'Prossima domanda &rarr;' : (st.cont || 'Continua &rarr;');
    c.classList.remove('hidden');
    c.onclick = nextStep;
  } else {
    // sbagliato: suggerimento mirato, ritenta
    btn.classList.add('wrong');
    btn.disabled = true;
    var h = document.getElementById('qhint');
    h.innerHTML = '<b>Rivedi.</b> '+st.hint;
    h.classList.add('show');
  }
}

function nextStep(){
  var u = S.units[S.ui];
  S.total++;
  if(S.si < u.steps.length-1){
    S.si++;
    renderStep();
  } else {
    S.ui++;
    S.si = 0;
    if(S.ui >= S.units.length){ endQuiz(); }
    else renderStep();
  }
}

function endQuiz(){
  show('end');
  document.getElementById('endScore').innerHTML = S.correct+' / '+S.total;
  var pct = S.total? Math.round(100*S.correct/S.total):0;
  var msg = pct>=85 ? 'Livello d&rsquo;esame solido.' :
            pct>=60 ? 'Buona base, ma alcuni trabocchetti ti hanno preso.' :
                      'Rivedi i suggerimenti: gli errori sono concettuali, non di calcolo.';
  document.getElementById('endMsg').innerHTML = 'Risposte corrette al primo tentativo. '+msg;
}

function toMenu(){ show('menu'); }

function show(which){
  ['menu','quiz','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', id!==which);
  });
  window.scrollTo(0,0);
}

renderMenu();
</script>
</body>
</html>
